name: temporary-prettier-artifact

on:
  push:
    branches:
      - tmp/prettier-darookhooneh

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prettier --write resources/js/pages/Brand/Show.vue resources/js/pages/Category/Show.vue
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add resources/js/pages/Brand/Show.vue resources/js/pages/Category/Show.vue
          if git diff --cached --quiet; then
            echo "No formatting changes to commit."
          else
            git commit -m "chore: format brand and category storefront pages"
            git push origin HEAD:tmp/prettier-darookhooneh
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-darookhooneh-pages
          path: |
            resources/js/pages/Brand/Show.vue
            resources/js/pages/Category/Show.vue
