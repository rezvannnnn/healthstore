name: tests

on:
  push:
    branches:
      - main
      - feat/darukhooneh-storefront-design-v2
  pull_request:

permissions:
  contents: write

concurrency:
  group: healthstore-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: |
          composer update --prefer-dist --no-interaction --no-progress
          composer setup

      - name: Apply frontend formatting
        if: github.event_name == 'pull_request'
        run: npx prettier --write resources/js/components/StorefrontFooter.vue resources/js/pages/Welcome.vue

      - name: Commit frontend formatting
        if: github.event_name == 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- resources/js/components/StorefrontFooter.vue resources/js/pages/Welcome.vue; then
            echo "Target files are already formatted."
          else
            git diff --binary -- resources/js/components/StorefrontFooter.vue resources/js/pages/Welcome.vue > /tmp/storefront-format.patch
            git fetch origin "${{ github.event.pull_request.head.ref }}"
            git reset --hard "origin/${{ github.event.pull_request.head.ref }}"
            git apply /tmp/storefront-format.patch
            git add resources/js/components/StorefrontFooter.vue resources/js/pages/Welcome.vue
            git commit -m "Format storefront footer and welcome page"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi

      - name: Check frontend formatting
        run: npm run format:check

      - name: Check PHP formatting
        run: composer lint:check

      - name: Run CI Checks
        run: composer ci:check
