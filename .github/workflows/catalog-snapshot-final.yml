name: Publish complete local catalog snapshot
on:
  push:
    branches: [codex/catalog-cloud-images-2026-10-22]
    paths: [.github/workflows/catalog-snapshot-final.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/catalog-snapshot-2026-10-22
          fetch-depth: 1
      - name: Wait for original local images
        run: |
          python3 - <<'PY'
          import json,pathlib,subprocess,time
          required={x['path'] for x in json.loads(pathlib.Path('healtstore/CATALOG-IMAGES.json').read_text())['images']}
          for attempt in range(120):
              subprocess.run(['git','fetch','origin','codex/catalog-snapshot-2026-10-22'],check=True)
              actual=set(subprocess.check_output(['git','ls-tree','-r','--name-only','FETCH_HEAD','--','healtstore/storage/app/public/products']).decode().splitlines())
              print(f'Original images: {len(required & actual)}/{len(required)}',flush=True)
              if required <= actual:
                  subprocess.run(['git','checkout','--detach','FETCH_HEAD'],check=True)
                  break
              time.sleep(60)
          else: raise SystemExit('Image upload incomplete; main unchanged')
          PY
      - name: Verify images and database
        run: |
          python3 - <<'PY'
          import hashlib,json,pathlib,sqlite3
          manifest=json.loads(pathlib.Path('healtstore/CATALOG-IMAGES.json').read_text())
          for image in manifest['images']:
              file=pathlib.Path(image['path'])
              assert file.stat().st_size==image['bytes'],image['path']
              with file.open('rb') as stream:
                  assert hashlib.file_digest(stream,'sha256').hexdigest()==image['sha256'],image['path']
          db=sqlite3.connect('healtstore/catalog-snapshot.sqlite')
          assert db.execute('pragma integrity_check').fetchone()[0]=='ok'
          assert not db.execute('pragma foreign_key_check').fetchall()
          assert db.execute('select count(*) from products').fetchone()[0]==12894
          assert db.execute('select count(*) from categories').fetchone()[0]==299
          assert db.execute('select count(distinct product_id) from catalog_import_sources').fetchone()[0]==12785
          assert db.execute('select count(*) from products p where p.id in (select product_id from catalog_import_sources) and (p.expiry_date is not null or (select coalesce(sum(quantity),0) from inventories i where i.product_id=p.id)!=10)').fetchone()[0]==0
          for (image,) in db.execute('select main_image from products where main_image is not null'):
              assert pathlib.Path('healtstore/storage/app/public',image).is_file(),image
          for table in ['users','orders','payments','sessions','otp_verifications','audit_logs','store_settings']:
              assert db.execute('select count(*) from '+table).fetchone()[0]==0
          assert hashlib.sha256(pathlib.Path('healtstore/catalog-snapshot.sqlite').read_bytes()).hexdigest()==json.loads(pathlib.Path('healtstore/CATALOG-SNAPSHOT.json').read_text())['sha256']
          print('All original images and catalog records verified')
          PY
      - name: Publish complete folder
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --unshallow
          git merge --no-edit FETCH_HEAD
          git push origin HEAD:main
      - name: Remove temporary workflows
        run: |
          git fetch origin codex/catalog-cloud-images-2026-10-22
          git checkout --detach FETCH_HEAD
          git rm .github/workflows/catalog-snapshot-assets.yml .github/workflows/catalog-snapshot-final.yml
          git commit -m 'Remove completed temporary catalog workflows'
          git push origin HEAD:codex/catalog-cloud-images-2026-10-22
